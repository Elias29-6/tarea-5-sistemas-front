<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Store — Redis CRUD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">Tarea 5 - Sistemas Distribuidos</h1>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Autores</h5>
            <form id="author-form" class="row g-2 align-items-end">
              <input type="hidden" id="author-id">
              <div class="col-6">
                <label class="form-label">Nombre</label>
                <input class="form-control" id="author-name" placeholder="Nombre del autor">
              </div>
              <div class="col-6">
                <label class="form-label">Bio</label>
                <input class="form-control" id="author-bio" placeholder="Bio corta">
              </div>
              <div class="col-12 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Guardar</button>
                <button class="btn btn-secondary" type="button" id="author-cancel">Cancelar</button>
              </div>
            </form>
            <hr>
            <table class="table table-sm align-middle">
              <thead><tr><th>ID</th><th>Nombre</th><th>Bio</th><th class="text-end">Acciones</th></tr></thead>
              <tbody id="authors-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Editoriales</h5>
            <form id="editorial-form" class="row g-2 align-items-end">
              <input type="hidden" id="editorial-id">
              <div class="col-6">
                <label class="form-label">Nombre</label>
                <input class="form-control" id="editorial-name" placeholder="Nombre de la editorial">
              </div>
              <div class="col-6">
                <label class="form-label">País</label>
                <input class="form-control" id="editorial-country" placeholder="País">
              </div>
              <div class="col-12 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Guardar</button>
                <button class="btn btn-secondary" type="button" id="editorial-cancel">Cancelar</button>
              </div>
            </form>
            <hr>
            <table class="table table-sm align-middle">
              <thead><tr><th>ID</th><th>Nombre</th><th>País</th><th class="text-end">Acciones</th></tr></thead>
              <tbody id="editorials-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
